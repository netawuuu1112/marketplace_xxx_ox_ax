# Temporary bridge for resolvers still caching the Finland IP after migration.
# Remove this site after the old A-record TTL has elapsed and the new VPS is stable.
server {
    listen 80;
    listen [::]:80;
    server_name marketfusionai.kosmo-connect.ru;
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name marketfusionai.kosmo-connect.ru;
    ssl_certificate /etc/letsencrypt/live/marketfusionai.kosmo-connect.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/marketfusionai.kosmo-connect.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass https://48.103.149.93;
        proxy_ssl_server_name on;
        proxy_ssl_name marketfusionai.kosmo-connect.ru;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
