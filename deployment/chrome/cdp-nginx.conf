worker_processes 1;
pid /tmp/marketfusion-nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 128; }

http {
    access_log off;
    client_body_temp_path /tmp/marketfusion-client-body;
    proxy_temp_path /tmp/marketfusion-proxy;
    fastcgi_temp_path /tmp/marketfusion-fastcgi;
    uwsgi_temp_path /tmp/marketfusion-uwsgi;
    scgi_temp_path /tmp/marketfusion-scgi;

    server {
        listen 9222;
        location / {
            proxy_pass http://127.0.0.1:9223;
            proxy_http_version 1.1;
            proxy_set_header Host 127.0.0.1:9223;
            proxy_set_header Accept-Encoding "";
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            sub_filter_types application/json;
            sub_filter_once off;
            sub_filter '127.0.0.1:9223' 'chrome:9222';
            proxy_read_timeout 60s;
        }
    }
}
