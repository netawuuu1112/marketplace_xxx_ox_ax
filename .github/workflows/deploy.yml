name: Deploy stable release to VPS
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable release tag (for example v1.0.0)
        required: true
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify stable release
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$DEPLOY_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git fetch origin main --tags
          git merge-base --is-ancestor "$DEPLOY_TAG" origin/main
          gh release view "$DEPLOY_TAG" --json isDraft --jq '.isDraft == false' | grep -qx true
      - name: Deploy over SSH
        env:
          DEPLOY_TAG: ${{ inputs.tag }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_APP_DIR: ${{ secrets.VPS_APP_DIR }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519 ~/.ssh/known_hosts
          ssh -o BatchMode=yes "$VPS_USER@$VPS_HOST" \
            "cd '$VPS_APP_DIR' && ./update.sh '$DEPLOY_TAG'"
