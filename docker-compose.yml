services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: marketfusion
      POSTGRES_USER: marketfusion
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketfusion -d marketfusion"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://marketfusion:${POSTGRES_PASSWORD}@db:5432/marketfusion
      SHOPPER_API_PORT: "8081"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: frontend/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    depends_on:
      - api

  bot:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "bot.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://marketfusion:${POSTGRES_PASSWORD}@db:5432/marketfusion
      SHOPPER_API_PORT: "8081"
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "worker.py"]
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://marketfusion:${POSTGRES_PASSWORD}@db:5432/marketfusion
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
